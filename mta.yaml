_schema-version: 3.3.0
ID: bc-aiui-features
description: A simple CAP project.
version: 1.0.0
modules:
- name: bc-aiui-features-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: bc-aiui-features-auth
  - name: bc-aiui-features-connectivity
  - name: bc-aiui-features-dev_aicore
  - name: bc-aiui-features-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: bc-aiui-features
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: bc-aiui-features-auth
  - name: bc-aiui-features-destination
  - name: bc-aiui-features-html5-runtime
  provides:
  - name: app-api
    properties:
      app-protocol: ${protocol}
      app-uri: ${default-uri}
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M
- name: bc-aiui-features-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: bc-aiui-features-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - bewlai.zip
      name: bewlai
      target-path: app/
    - artifacts:
      - bewlaiaidemo.zip
      name: bewlaiaidemo
      target-path: app/
- name: bewlai
  type: html5
  path: ui5-cap-ai-features
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: bewlaiaidemo
  type: html5
  path: app/aidemo
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: bc-aiui-features-dev_aicore
  type: org.cloudfoundry.managed-service
  parameters:
    service: aicore
    service-name: 111_BC_AICORE_EXTENDED
    service-plan: extended
- name: bc-aiui-features-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: bc-aiui-features-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: bc-aiui-features-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: bc-aiui-features-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: bc-aiui-features-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
- name: bc-aiui-features-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: bc-aiui-features-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
