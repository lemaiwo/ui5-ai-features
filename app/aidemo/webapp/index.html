<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>App Title</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="/be.wl.ai.aidemo/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "be.wl.ai.aidemo": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
    <script>
        // Deployed, be.wl.ai is a sibling app in the HTML5 application repository, served at
        // /<sap.cloud service without dots>.<sap.app id without dots>. Locally the UI5 dev
        // server already serves the library under this app's own /resources.
        if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname)) {
            sap.ui.loader.config({
                paths: {
                    "be/wl/ai": "/bewlai.bewlai"
                }
            });
        }
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="be.wl.ai.aidemo"
        data-id="container"
        data-settings='{"id" : "be.wl.ai.aidemo"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
